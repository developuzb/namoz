[project]
name = "taqvim-bot"
version = "1.0.0"
description = "O'zbekiston namoz vaqtlari Telegram boti — kanal va DM obunachilarga"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "TAQVIMbot Team" }
]
dependencies = [
    # Telegram
    "aiogram>=3.13.1,<4.0",
    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    # Scheduler
    "apscheduler>=3.10.4,<4.0",
    # HTTP
    "httpx>=0.28.0",
    # Config
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    # Image / Hijri
    "pillow>=11.0.0",
    "hijri-converter>=2.3.1",
    # Time zones
    "pytz>=2024.2",
    # Logging
    "loguru>=0.7.3",
    # HTML parsing (zaxira provider uchun)
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    # Admin uchun stats grafiklar
    "matplotlib>=3.10.0",
    # Google Sheets sync (doimiy xotira)
    "gspread>=6.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "ASYNC",    # async checks
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line too long (formatter handles it)
    "B008",     # function call in default args (FastAPI/aiogram pattern)
    # Loyiha lotin + kirill (o'zbekcha) matn bilan ishlaydi — namoz nomlari,
    # viloyatlar va foydalanuvchi matnlari kirillda ham keladi. Shu sabab
    # "ambiguous unicode character" qoidalari o'chirilgan (false-positive).
    "RUF001",   # ambiguous char in string
    "RUF002",   # ambiguous char in docstring
    "RUF003",   # ambiguous char in comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/versions"]

# ---------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
